<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>بوابة مشاريعي</title>
 <!-- استدعاء خط Cairo من Google Fonts -->
 <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet"> <!-- استدعاء مكتبة الأيقونات FontAwesome --> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 <style>
 :root {
 --primary-color: #6c5ce7;
 --bg-gradient-1: #1a2a6c;
 --bg-gradient-2: #b21f1f;
 --bg-gradient-3: #fdbb2d;
 }

 body {
 margin: 0;
 padding: 0;
 font-family: 'Cairo', sans-serif;
 background: linear-gradient(135deg, var(--bg-gradient-1), var(--bg-gradient-2), var(--bg-gradient-3));
 background-size: 400% 400%;
 animation: gradientBG 15s ease infinite;
 min-height: 100vh;
 color: #fff;
 display: flex;
 flex-direction: column;
 align-items: center;
 }

 @keyframes gradientBG {
 0% { background-position: 0% 50%; }
 50% { background-position: 100% 50%; }
 100% { background-position: 0% 50%; }
 }

 header {
 text-align: center;
 margin-top: 50px;
 margin-bottom: 40px;
 }

 header h1 {
 font-size: 2.5rem;
 font-weight: 800;
 margin: 0;
 text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
 }

 header p {
 font-size: 1.1rem;
 color: rgba(255, 255, 255, 0.8);
 margin-top: 10px;
 }

 .container {
 width: 90%;
 max-width: 1200px;
 display: grid;
 grid-template-columns: repeat(4, 1fr);
 gap: 20px;
 padding-bottom: 50px;
 }

 /* استعلامات الوسائط (Responsive Design) */
 @media (max-width: 992px) {
 .container { grid-template-columns: repeat(3, 1fr); }
 }
 @media (max-width: 768px) {
 .container { grid-template-columns: repeat(2, 1fr); }
 }
 @media (max-width: 480px) {
 .container { grid-template-columns: repeat(2, 1fr); gap: 15px; }
 header h1 { font-size: 2rem; }
 }

 .card {
 background: rgba(255, 255, 255, 0.1);
 backdrop-filter: blur(10px);
 -webkit-backdrop-filter: blur(10px);
 border: 1px solid rgba(255, 255, 255, 0.2);
 border-radius: 20px;
 padding: 25px 15px;
 text-align: center;
 text-decoration: none;
 color: #fff;
 transition: all 0.3s ease;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
 }

 .card:hover {
 transform: translateY(-10px);
 background: rgba(255, 255, 255, 0.2);
 box-shadow: 0 15px 45px 0 rgba(0, 0, 0, 0.3);
 border-color: rgba(255, 255, 255, 0.4);
 }

 .card i {
 font-size: 2.5rem;
 margin-bottom: 15px;
 color: #fff;
 transition: transform 0.3s ease;
 }

 .card:hover i {
 transform: scale(1.1);
 color: var(--primary-color);
 }

 .card h3 {
 margin: 0;
 font-size: 1.2rem;
 font-weight: 600;
 text-transform: capitalize;
 }
 </style>
</head>
<body>

 <header>
 <h1>بوابة المشاريع</h1> <p>الوصول السريع لجميع التطبيقات والأدوات</p> </header>
